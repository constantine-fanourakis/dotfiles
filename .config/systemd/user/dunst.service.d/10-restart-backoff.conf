[Service]
# The vendor unit sets no Restart, so a dead dunst stays dead until the next
# login and notifications fall back to client-drawn toplevel windows that never
# time out. Restart=always rather than on-failure: Type=dbus means releasing the
# bus name makes systemd SIGTERM the process, and on-failure excludes SIGTERM,
# so a crash that drops the D-Bus connection reads as a clean exit.
Restart=always

# Default RestartSec is 100ms, so 5 failures burn the start limit in ~1s -- fast
# enough to exhaust it during a logout, before the next compositor exists.
# Backing off means the retries span the session gap and recover on their own.
RestartSec=5s

[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10
