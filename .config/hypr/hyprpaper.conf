# hyprpaper 0.8.x config format.
# NOTE: 'preload' no longer exists; wallpapers are declared as a block.
splash = false
ipc    = true

wallpaper {
    monitor  =
    path     = /usr/share/wallpapers/openSUSEtumbleweed.png
    fit_mode = cover
}

