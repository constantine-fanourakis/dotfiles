# hyprpaper 0.8.x: wallpapers are declared as a block. There is no preload
# directive in this format.
splash = false
ipc    = true

wallpaper {
    monitor  =
    path     = /home/kalidasa/Pictures/Wallpapers/bing/current.jpg
    fit_mode = cover
}

