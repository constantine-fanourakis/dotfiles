# hyprlock 0.9.x
# Catppuccin Mocha, official port: https://github.com/catppuccin/hyprlock
source = /home/kalidasa/.config/hypr/mocha.conf

$font = FiraCode Nerd Font

general {
    hide_cursor = false
}

# You have a Synaptics fingerprint reader + fprintd installed.
# Requires an enrolled finger: run `fprintd-enroll` once.
auth {
    fingerprint {
        enabled         = true
        ready_message   = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay     = 250
    }
}

animations {
    enabled = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 8
    noise       = 0.0117
    contrast    = 0.9
    brightness  = 0.8
}

input-field {
    monitor           =
    size              = 300, 50
    outline_thickness = 2
    dots_size         = 0.25
    dots_spacing      = 0.3
    dots_center       = true
    rounding          = 15

    outer_color = $mauve $blue 45deg
    inner_color = $surface0
    font_color  = $text
    check_color = $green
    fail_color  = $red

    font_family      = $font
    fade_on_empty    = false
    placeholder_text = <i>Password or fingerprint...</i>
    fail_text        = <i>$PAMFAIL$FPRINTFAIL</i>

    position = 0, -40
    halign   = center
    valign   = center
}

# TIME - $TIME is built in and refreshes itself every second
label {
    monitor     =
    text        = $TIME
    color       = $text
    font_size   = 90
    font_family = $font
    position    = 0, 120
    halign      = center
    valign      = center
}

# DATE
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = $subtext0
    font_size   = 20
    font_family = $font
    position    = 0, 50
    halign      = center
    valign      = center
}
