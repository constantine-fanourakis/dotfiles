# dpms commands use the Lua expression form. `hyprctl dispatch dpms off` is
# legacy syntax and is rejected under a Lua config, leaving the screen lit.
general {
    lock_cmd       = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

# 5 min: dim the backlight
listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 10 min: lock
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 10 min 30 s: screen off, 30s after the lock above.
# Unlocking counts as input and resets the idle timer, so this cannot fire
# while the session is back in use.
listener {
    timeout    = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 30 min: suspend -- ONLY on battery.
# condition_cmd gates the action: exit 0 = run it. AC/online is 1 when plugged
# in, so this succeeds only on battery and the machine never sleeps on AC.
# condition_retry re-checks every 60s, so unplugging later still suspends.
listener {
    timeout       = 1800
    on-timeout    = systemctl suspend
    condition_cmd = test "$(cat /sys/class/power_supply/AC/online)" = "0"
    condition_retry = 60
}
